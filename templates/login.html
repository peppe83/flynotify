{% extends "base.html" %}
{% block title %}Accedi · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <h1 class="h3 mb-3">Accedi</h1>
    {% if request.query_params.get('error') %}
      <div class="alert alert-danger">Email o password non validi.</div>
    {% endif %}
    <form method="post" action="/auth/login">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Accedi</button>
    </form>
    <p class="mt-3 text-center">Non hai un account? <a href="/signup">Registrati</a></p>
  </div>
</div>
{% endblock %}
